<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">How the Tizen launcher fits together</title>
  <desc id="desc">Remote navigation, launcher UI, Tizen application APIs, installed apps and browser, with local preferences and widgets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09151f"/><stop offset="1" stop-color="#132a38"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1a3040"/><stop offset="1" stop-color="#122432"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#8db9c7"/></marker>
  </defs>
  <rect width="1280" height="600" rx="24" fill="url(#bg)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="70" fill="#9dc8d5" font-size="12" font-weight="700" letter-spacing="2.2">UNDER THE HOOD</text>
    <text x="64" y="112" fill="#f2f6f7" font-size="31" font-weight="600" letter-spacing="-.8">A small web app, with the TV doing the launching</text>

    <!-- Main flow cards -->
    <g>
      <rect x="62" y="172" width="238" height="190" rx="18" fill="url(#card)" stroke="#b9d3dc" stroke-opacity=".19"/>
      <circle cx="93" cy="210" r="15" fill="#8db9c7" fill-opacity=".2"/>
      <path d="M85 210h16M93 202v16" stroke="#c8e1e7" stroke-width="2" stroke-linecap="round"/>
      <text x="84" y="254" fill="#f1f6f7" font-size="19" font-weight="600">TV remote</text>
      <text x="84" y="283" fill="#b5c8d0" font-size="14">Arrows · Select · Back</text>
      <text x="84" y="307" fill="#b5c8d0" font-size="14">Green / red / blue actions</text>
      <text x="84" y="339" fill="#91aab5" font-size="11">Home-key routing is a TV setting</text>

      <rect x="354" y="172" width="252" height="190" rx="18" fill="url(#card)" stroke="#b9d3dc" stroke-opacity=".19"/>
      <circle cx="386" cy="210" r="15" fill="#8db9c7" fill-opacity=".2"/>
      <rect x="379" y="204" width="14" height="12" rx="2" fill="none" stroke="#c8e1e7" stroke-width="2"/>
      <text x="376" y="254" fill="#f1f6f7" font-size="19" font-weight="600">Launcher UI</text>
      <text x="376" y="283" fill="#b5c8d0" font-size="14">Text-first list + one focused icon</text>
      <text x="376" y="307" fill="#b5c8d0" font-size="14">Saved pins, greeting, wallpapers</text>
      <text x="376" y="339" fill="#91aab5" font-size="11">Plain HTML / CSS / JavaScript</text>

      <rect x="660" y="172" width="252" height="190" rx="18" fill="url(#card)" stroke="#b9d3dc" stroke-opacity=".19"/>
      <circle cx="692" cy="210" r="15" fill="#8db9c7" fill-opacity=".2"/>
      <path d="M684 210h16M692 202v16" stroke="#c8e1e7" stroke-width="2" stroke-linecap="round"/>
      <text x="682" y="254" fill="#f1f6f7" font-size="19" font-weight="600">Tizen APIs</text>
      <text x="682" y="283" fill="#b5c8d0" font-size="14">Installed app IDs + icon paths</text>
      <text x="682" y="307" fill="#b5c8d0" font-size="14">App launch + URL app control</text>
      <text x="682" y="339" fill="#91aab5" font-size="11">No root or system-package edits</text>

      <rect x="966" y="172" width="252" height="190" rx="18" fill="url(#card)" stroke="#b9d3dc" stroke-opacity=".19"/>
      <circle cx="998" cy="210" r="15" fill="#8db9c7" fill-opacity=".2"/>
      <path d="M990 202h16v16h-16zM994 206h8v8h-8z" fill="none" stroke="#c8e1e7" stroke-width="1.6"/>
      <text x="988" y="254" fill="#f1f6f7" font-size="19" font-weight="600">Apps &amp; browser</text>
      <text x="988" y="283" fill="#b5c8d0" font-size="14">Open apps already installed</text>
      <text x="988" y="307" fill="#b5c8d0" font-size="14">Open HTTPS website shortcuts</text>
      <text x="988" y="339" fill="#91aab5" font-size="11">Samsung Home stays as fallback</text>
    </g>
    <path d="M302 267h42M608 267h42M914 267h42" fill="none" stroke="#8db9c7" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Local-only supporting paths -->
    <rect x="62" y="416" width="554" height="122" rx="16" fill="#102331" stroke="#8db9c7" stroke-opacity=".22"/>
    <text x="88" y="451" fill="#eaf2f4" font-size="16" font-weight="600">Local preferences</text>
    <text x="88" y="479" fill="#b5c8d0" font-size="14">Pinned order · recent apps · name/greeting · personal wallpapers</text>
    <text x="88" y="507" fill="#91aab5" font-size="12">Stored on the TV; no account or analytics service</text>

    <rect x="664" y="416" width="554" height="122" rx="16" fill="#102331" stroke="#8db9c7" stroke-opacity=".22"/>
    <text x="690" y="451" fill="#eaf2f4" font-size="16" font-weight="600">Local custom.js widgets</text>
    <text x="690" y="479" fill="#b5c8d0" font-size="14">Small user-owned panels, packaged with the signed app</text>
    <text x="690" y="507" fill="#91aab5" font-size="12">No remote code loading · network access off by default</text>
    <path d="M480 364v34H339v18M786 364v34h155v18" fill="none" stroke="#789eac" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  </g>
</svg>
